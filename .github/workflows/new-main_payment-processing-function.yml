name: Build and deploy Node.js project to Azure Function App - payment-processing-function

on:
  push:
    branches:
      - New-Main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read

env:
  NODE_VERSION: '22.x'
  APP_NAME: 'ri-pp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint + build + test)
        run: |
          rm -rf dist release.zip package
          npm run verify

      - name: Ensure build output exists
        run: |
          set -euo pipefail
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist directory is missing or empty after build; refusing to package an empty deployment." >&2
            exit 1
          fi

      - name: Prepare deployment package
        run: |
          set -euo pipefail
          mkdir package
          cp -r dist package/
          cp -r node_modules package/
          cp host.json package/
          cp package-lock.json package/

          # Ship a package.json whose `build` is a no-op — see the equivalent step in
          # main_payment-processing-function.yml for the full rationale. In short: this
          # artifact is already built, but if Azure/functions-action fails to patch
          # SCM_DO_BUILD_DURING_DEPLOYMENT=false (a Kudu call that can fail), Oryx runs
          # a server-side `npm run build`, which cannot succeed because form-builder-ui/
          # is not shipped. Making it a no-op keeps the deploy from depending on that.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.scripts = {
              ...pkg.scripts,
              build: 'echo \"Prebuilt by CI - skipping build during deployment.\"',
            };
            fs.writeFileSync('package/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          cd package && zip -r ../release.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package

      - name: Azure Login (OIDC)
        uses: azure/login@v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: release.zip
