name: Build and deploy Node.js project to Azure Function App - payment-processing-function

on:
  push:
    branches:
      - prod
      - Test
  workflow_dispatch:

concurrency:
  group: payment-processing-function-prod
  cancel-in-progress: true

env:
  AZURE_FUNCTIONAPP_NAME: payment-processing-function
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          rm -rf dist release.zip deployment-package
          npm run verify

      - name: Bundle deployment package
        run: |
          set -euo pipefail
          mkdir -p deployment-package
          cp -r dist deployment-package/
          cp -r node_modules deployment-package/
          cp host.json deployment-package/
          cp package-lock.json deployment-package/

          # Ship a package.json whose `build` is a no-op.
          #
          # This artifact is already built: `dist` and `node_modules` are in the zip.
          # zipdeploy is supposed to treat it as ready-to-run, and Azure/functions-action
          # normally guarantees that by patching SCM_DO_BUILD_DURING_DEPLOYMENT=false at
          # deploy time. That patch is a Kudu API call (POST /api/settings) and on this
          # app it fails on every run — the action logs it as a warning and carries on.
          # The app's own settings then decide, and they are currently
          # SCM_DO_BUILD_DURING_DEPLOYMENT=true / ENABLE_ORYX_BUILD=true (you can read
          # them off the action's own "Restoring ... to true" lines), so Oryx runs a
          # server-side build on every deploy and executes `npm run build` against the
          # extracted package. That build cannot succeed here: it runs
          # `npm --prefix form-builder-ui ci`, and form-builder-ui/ is deliberately not
          # shipped. The deploy then fails after the artifact was already verified green
          # in CI (run 30354402103).
          #
          # Neutering the script makes an unintended remote build a no-op instead of a
          # hard failure, so the deploy no longer depends on that patch succeeding.
          # The durable companion fix is Azure-side: set SCM_DO_BUILD_DURING_DEPLOYMENT
          # and ENABLE_ORYX_BUILD to false persistently on the app (false is zipdeploy's
          # own default) so the remote build never starts. See DEPLOYMENT_CHECKLIST.md.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.scripts = {
              ...pkg.scripts,
              build: 'echo \"Prebuilt by CI - skipping build during deployment.\"',
            };
            fs.writeFileSync(
              'deployment-package/package.json',
              JSON.stringify(pkg, null, 2) + '\n'
            );
          "

          cd deployment-package && zip -r ../release.zip .
          cd .. && rm -rf deployment-package

      - uses: actions/upload-artifact@v7
        with:
          name: function-package
          path: release.zip

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://payment-processing-function.azurewebsites.net

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: function-package

      - uses: Azure/functions-action@v1.5.6
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PRODUCTION_PUBLISH_PROFILE }}

  smoke-test-production:
    runs-on: ubuntu-latest
    needs: deploy-production
    environment:
      name: production
      url: https://payment-processing-function.azurewebsites.net

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wait for production warm-up
        run: sleep 30

      - name: Validate smoke configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$PRODUCTION_FUNCTION_KEY" ] || { echo "Missing AZURE_FUNCTIONAPP_PRODUCTION_FUNCTION_KEY" >&2; exit 1; }
          [ -n "$PRODUCTION_SMOKE_TRANSACTION_PAYLOAD" ] || { echo "Missing AZURE_FUNCTIONAPP_PRODUCTION_SMOKE_TRANSACTION_PAYLOAD" >&2; exit 1; }
        env:
          PRODUCTION_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTIONAPP_PRODUCTION_FUNCTION_KEY }}
          PRODUCTION_SMOKE_TRANSACTION_PAYLOAD: ${{ secrets.AZURE_FUNCTIONAPP_PRODUCTION_SMOKE_TRANSACTION_PAYLOAD }}

      - name: Run smoke test
        run: npm run deployment:smoke
        env:
          SMOKE_BASE_URL: ${{ vars.AZURE_FUNCTIONAPP_PRODUCTION_URL != '' && vars.AZURE_FUNCTIONAPP_PRODUCTION_URL || 'https://payment-processing-function.azurewebsites.net' }}
          SMOKE_HEALTH_PATH: ${{ vars.AZURE_FUNCTIONAPP_HEALTH_PATH != '' && vars.AZURE_FUNCTIONAPP_HEALTH_PATH || '/api/health' }}
          SMOKE_TRANSACTION_PATH: ${{ vars.AZURE_FUNCTIONAPP_TRANSACTION_PATH != '' && vars.AZURE_FUNCTIONAPP_TRANSACTION_PATH || '/api/transaction?mode=test' }}
          SMOKE_VERIFY_PATH: ${{ vars.AZURE_FUNCTIONAPP_TEST_ARTIFACT_VERIFY_PATH != '' && vars.AZURE_FUNCTIONAPP_TEST_ARTIFACT_VERIFY_PATH || '/api/ops/test-artifact-verify' }}
          SMOKE_CLEANUP_PATH: ${{ vars.AZURE_FUNCTIONAPP_TEST_ARTIFACT_CLEANUP_PATH != '' && vars.AZURE_FUNCTIONAPP_TEST_ARTIFACT_CLEANUP_PATH || '/api/ops/test-artifact-cleanup' }}
          SMOKE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTIONAPP_PRODUCTION_FUNCTION_KEY }}
          SMOKE_TRANSACTION_PAYLOAD: ${{ secrets.AZURE_FUNCTIONAPP_PRODUCTION_SMOKE_TRANSACTION_PAYLOAD }}
          SMOKE_MAX_AMOUNT_CENTS: '5000'
          SMOKE_TEST_TAG: production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_CLEANUP_LIVE_MODE: 'false'
          SMOKE_SYSTEMS: stripe,salesforce,qbo
          SMOKE_DELETE_SALESFORCE_CONTACTS: 'true'
          SMOKE_SEARCH_PROPAGATION_DELAY_MS: '65000'
          # Post a fully-populated payload and read the records back, so a deploy that
          # breaks field routing fails here rather than silently shipping.
          SMOKE_FULL_FIELD_COVERAGE: 'true'
          SMOKE_UNIQUE_EMAIL: 'true'
          # Set to 'false' if Transaction__c lacks Cover_Fees__c / Cover_Fees_Amount__c:
          # Salesforce rejects the entire upsert on an unknown column, so one missing
          # field means the transaction never reaches Salesforce at all.
          SMOKE_COVER_FEES: 'true'
          SMOKE_VERIFY_ENABLED: 'true'
          SMOKE_VERIFY_DELAY_MS: '30000'
          SMOKE_VERIFY_ATTEMPTS: '4'
          SMOKE_VERIFY_RETRY_DELAY_MS: '20000'
          # Record types and picklist configuration are org concerns, not deploy
          # regressions — they warn here instead of blocking the pipeline.
          SMOKE_VERIFY_REQUIRE_OPTIONAL: 'false'
          SMOKE_ORGANIZATION_NAME: Payment Processor Smoke Test Org
          SMOKE_CAMPAIGN_NAME: Deployment Smoke Test
